<!DOCTYPE html>
<html>

<head>
    <title>Birthday Puzzle</title>
    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }
    </style>
</head>

<body>

    <h1 style="font-size: 12vw;">ACCESS RESTRICTED</h1>

    <p style="font-size: 10vw;">Enter the recovery code:</p>

    <input id="answer">

    <button onclick="checkAnswer()">Submit</button>

    <p id="result"></p>

    <div id="secret" style="display:none;">
        <h2>Evidence Package #1</h2>
        <a href="images/Untitled drawing (21).png">Open Evidence Package</a>
    </div>

    <script>
        function checkAnswer() {

            let answer =
                document.getElementById("answer").value;

            if (answer.toLowerCase() === "apple") {

                document.getElementById("result").innerText =
                    "ACCESS GRANTED";

                document.getElementById("secret").style.display =
                    "block";
            }

            else {

                document.getElementById("result").innerText =
                    "ACCESS DENIED";

            }
        }
    </script>

</body>

</html>
