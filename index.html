<!DOCTYPE html>
<html>

<head>
    <title>Birthday Puzzle</title>
    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }
    </style>
</head>

<body>

    <p style="font-size: 4vw;">yes i've made a website again, but no, we're not travelling down the memory lane this time. goodluck.</p>

    <p style="font-size: 4vw;">to start, i want you to tell me the city this image is from:</p>

    <img src="images/sea.jpg" width="640px" height="481px">

    <input id="answer">

    <button style="font-size: 1vw;" onclick="checkAnswer()">Submit</button>

    <p id="result"></p>

    <div id="secret" style="display:none;">
        <a href="images/Untitled drawing (21).png">next level</a>
    </div>

    <script>
        function checkAnswer() {

            let answer =
                document.getElementById("answer").value;

            if (answer.toLowerCase() === "puri") {

                document.getElementById("result").innerText =
                    "CORRECT, congrats";

                document.getElementById("secret").style.display =
                    "block";
            }

            else {

                document.getElementById("result").innerText =
                    "no not that";

            }
        }
    </script>

</body>

</html>
