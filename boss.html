<!DOCTYPE html>
<html>

<head>
    <title>Final Boss</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="message" style="font-size:2rem;"></div>

        <input id="answer">

        <button onclick="checkAnswer()">
            Submit
        </button>

        <p id="result"></p>

        <div id="secret" style="display:none;">
            <p>i love you cixin!!</p>

            <a href="images/sea.jpg">
                here's your gift (fr this time)
            </a>
        </div>

    </div>

    <script>

        const introText =
            "congratulations...\n\n...or so you thought haha\n\nyou have solved the puzzles, now i want you to enter the code which was shared on each page of the puzzle, enter it in order.";

        let i = 0;

        function typeWriter() {

            if (i < introText.length) {

                document.getElementById("message").innerHTML +=
                    introText.charAt(i) === "\n"
                    ? "<br>"
                    : introText.charAt(i);

                i++;

                setTimeout(typeWriter, 35);

            }

            else {

                document.getElementById("message").innerHTML +=
                    '<span class="cursor">_</span>';

                setTimeout(() => {

                    document.getElementById("content").style.display =
                        "block";

                }, 800);

            }
        }

        window.onload = typeWriter;

        function checkAnswer() {

            let answer =
                document.getElementById("answer").value;

            if (answer.toUpperCase() === "ILYCIXIN") {

                document.getElementById("result").innerText =
                    "";

                document.getElementById("secret").style.display =
                    "block";

            }

            else {

                document.getElementById("result").innerText =
                    "incorrect";

            }

        }

    </script>

</body>

</html>
