<!DOCTYPE html>
<html>

<head>
    <title>Teddy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="message" style="font-size:2rem;"></div>

    <img id="teddy" src="images/teddy.jpeg">

    <button id="nextButton"
        onclick="window.location.href='l2.html'">
        thank you teddy
    </button>

    <script>

        const text =
            "congrats on solving the first two. here's teddy to wish you luck for the remaining puzzles.";

        let i = 0;

        function typeWriter() {

            if (i < text.length) {

                document.getElementById("message").innerHTML +=
                    text.charAt(i);

                i++;

                setTimeout(typeWriter, 35);

            } else {

                document.getElementById("message").innerHTML +=
                    '<span class="cursor">_</span>';

                setTimeout(() => {

                    document.getElementById("teddy").style.display =
                        "block";

                    document.getElementById("nextButton").style.display =
                        "block";

                }, 700);
            }
        }

        window.onload = typeWriter;

    </script>

</body>

</html>
